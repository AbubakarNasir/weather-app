<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>
<body>
    <div class="app">
        <div class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--text-faint)"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="searchInput" placeholder="Search city">
            <button id="searchBtn" class="icon-btn" aria-label="Refresh">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
            </button>
        </div>
        <div class="hero">
            <div class="location"><span id="location">Lagos</span> &middot;  <span id="date">Wed, Aug 8</span></div>

            <svg class="condition-icon" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 15a4 4 0 0 1 .5-7.9A5.5 5.5 0 0 1 18 9.5a3.5 3.5 0 0 1-1 6.9H7z"/>
            <line x1="9" y1="19" x2="9" y2="21"/>
            <line x1="13" y1="19" x2="13" y2="21.5"/>
            <line x1="17" y1="19" x2="17" y2="21"/>
            </svg>

            <div class="temp-now"><span id="temp">27</span><sup>&deg;</sup></div>
            <div class="condition-label">Light rain</div>
            <div class="condition-sub">FEELS LIKE <span id="feelsLike">30</span>&deg; &middot; H:<span id="high">30</span>&deg; L:<span id="low">24</span>&deg;</div>
        </div>

        <div class="stats">
            <div class="stat">
            <div class="stat-label">Humidity</div>
            <div class="stat-value"><span id="humidity">84</span>%</div>
            </div>
            <div class="stat">
            <div class="stat-label">Wind</div>
            <div class="stat-value"><span id="wind">14</span> km/h</div>
            </div>
            <div class="stat">
            <div class="stat-label">Rain</div>
            <div class="stat-value"><span id="rain">70</span>%</div>
            </div>
        </div>

        <div class="section-label">Hourly</div>
        <div class="hourly" id="hourlyForecast">

            <div class="hour now">
            <div class="hour-time"><span id="hour-time0">Now</span></div>
            <div class="hour-condition" id="hour-condition0"></div>
            <div class="hour-icon" id="hour-icon0"></div>
            <!-- <svg class="hour-icon" id="hour-icon0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .5-7.9A5.5 5.5 0 0 1 18 9.5a3.5 3.5 0 0 1-1 6.9H7z"/><line x1="9" y1="19" x2="9" y2="21"/><line x1="13" y1="19" x2="13" y2="21.5"/></svg> -->
            <div class="hour-temp"><span id="hour-temp0"></span>&deg;</div>
            </div>

            <div class="hour">
            <div class="hour-time"><span id="hour-time1">5pm</span></div>
            <div class="hour-condition" id="hour-condition1"></div>
            <div class="hour-icon" id="hour-icon1"></div>
            <!-- <svg class="hour-icon" id="hour-icon1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4 1.6A4 4 0 0 0 7 19h10.5z"/></svg> -->
            <div class="hour-temp"><span id="hour-temp1"></span>&deg;</div>
            </div>

            <div class="hour">
            <div class="hour-time"><span id="hour-time2">6pm</span></div>
            <div class="hour-condition" id="hour-condition2"></div>
            <div class="hour-icon" id="hour-icon2"></div>
            <!-- <svg class="hour-icon" id="hour-icon2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg> -->
            <div class="hour-temp"><span id="hour-temp2"></span>&deg;</div>
            </div>

            <div class="hour">
            <div class="hour-time"><span id="hour-time3">7pm</span></div>
            <div class="hour-condition" id="hour-condition3"></div>
            <div class="hour-icon" id="hour-icon3"></div>
            <!-- <svg class="hour-icon" id="hour-icon3" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg> -->
            <div class="hour-temp"><span id="hour-temp3"></span>&deg;</div>
            </div>

            <div class="hour">
            <div class="hour-time"><span id="hour-time4">8pm</span></div>
            <div class="hour-condition" id="hour-condition4"></div>
            <div class="hour-icon" id="hour-icon4"></div>
            <!-- <svg class="hour-icon" id="hour-icon4" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4 1.6A4 4 0 0 0 7 19h10.5z"/></svg> -->
            <div class="hour-temp"><span id="hour-temp4"></span>&deg;</div>
            </div>

            <div class="hour">
            <div class="hour-time"><span id="hour-time5">9pm</span></div>
            <div class="hour-condition" id="hour-condition5"></div>
            <div class="hour-icon" id="hour-icon5"></div>
            <!-- <svg class="hour-icon" id="hour-icon5" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .5-7.9A5.5 5.5 0 0 1 18 9.5a3.5 3.5 0 0 1-1 6.9H7z"/><line x1="9" y1="19" x2="9" y2="21"/><line x1="13" y1="19" x2="13" y2="21.5"/></svg> -->
            <div class="hour-temp"><span id="hour-temp5"></span>&deg;</div>
            </div>

        </div>

        <div class="section-label" style="margin-top:20px;">7-day forecast</div>
        <div class="daily">

            <div class="day-row">
            <div class="day-name">Mon</div>
            <div class="day-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .5-7.9A5.5 5.5 0 0 1 18 9.5a3.5 3.5 0 0 1-1 6.9H7z"/><line x1="9" y1="19" x2="9" y2="21"/><line x1="13" y1="19" x2="13" y2="21.5"/></svg>
            </div>
            <div class="day-bar"></div>
            <div class="day-low">24&deg;</div>
            <div class="day-high">30&deg;</div>
            </div>

            <div class="day-row">
            <div class="day-name">Tue</div>
            <div class="day-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
            </div>
            <div class="day-bar"></div>
            <div class="day-low">25&deg;</div>
            <div class="day-high">32&deg;</div>
            </div>

            <div class="day-row">
            <div class="day-name">Wed</div>
            <div class="day-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4 1.6A4 4 0 0 0 7 19h10.5z"/></svg>
            </div>
            <div class="day-bar"></div>
            <div class="day-low">23&deg;</div>
            <div class="day-high">29&deg;</div>
            </div>

            <div class="day-row" style="border-bottom:none;">
            <div class="day-name">Thu</div>
            <div class="day-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .5-7.9A5.5 5.5 0 0 1 18 9.5a3.5 3.5 0 0 1-1 6.9H7z"/><line x1="9" y1="19" x2="9" y2="21"/><line x1="13" y1="19" x2="13" y2="21.5"/></svg>
            </div>
            <div class="day-bar"></div>
            <div class="day-low">24&deg;</div>
            <div class="day-high">31&deg;</div>
            </div>

            <div class="day-row" style="border-bottom:none;">
            <div class="day-name">Fri</div>
            <div class="day-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .5-7.9A5.5 5.5 0 0 1 18 9.5a3.5 3.5 0 0 1-1 6.9H7z"/><line x1="9" y1="19" x2="9" y2="21"/><line x1="13" y1="19" x2="13" y2="21.5"/></svg>
            </div>
            <div class="day-bar"></div>
            <div class="day-low">24&deg;</div>
            <div class="day-high">31&deg;</div>
            </div>

            <div class="day-row" style="border-bottom:none;">
            <div class="day-name">Sat</div>
            <div class="day-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .5-7.9A5.5 5.5 0 0 1 18 9.5a3.5 3.5 0 0 1-1 6.9H7z"/><line x1="9" y1="19" x2="9" y2="21"/><line x1="13" y1="19" x2="13" y2="21.5"/></svg>
            </div>
            <div class="day-bar"></div>
            <div class="day-low">24&deg;</div>
            <div class="day-high">31&deg;</div>
            </div>

            <div class="day-row" style="border-bottom:none;">
            <div class="day-name">Sun</div>
            <div class="day-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .5-7.9A5.5 5.5 0 0 1 18 9.5a3.5 3.5 0 0 1-1 6.9H7z"/><line x1="9" y1="19" x2="9" y2="21"/><line x1="13" y1="19" x2="13" y2="21.5"/></svg>
            </div>
            <div class="day-bar"></div>
            <div class="day-low">24&deg;</div>
            <div class="day-high">31&deg;</div>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
